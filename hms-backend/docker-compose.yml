services:
  mysql:
    image: mysql:8.0
    container_name: mysql-hms
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hms_db
      MYSQL_USER: hms
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - hms-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka:
    build:
      context: ./eureka
    image: "gourav60/eureka:v1"
    container_name: eureka
    restart: always
    environment:
      SPRING_APPLICATION_NAME: "eureka"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: false
      EUREKA_CLIENT_FETCH_REGISTRY: false
    ports:
      - "8761:8761"
    healthcheck:
      test: "curl --fail --silent http://eureka:8761/actuator/health/readiness || exit 1"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - hms-network

  gateway:
    build:
      context: ./gatewayMS
    image: "gourav60/gateway:v1"
    container_name: gateway-ms
    restart: always
    depends_on:
      eureka:
        condition: service_healthy
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    ports:
      - "9000:9000"
    healthcheck:
      test: "curl --fail --silent http://gateway-ms:9000/actuator/health/readiness || exit 1"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - hms-network


  user-ms:
    build:
      context: ./userMS
    image: "gourav60/user-ms:v1"
    container_name: user-ms
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
      gateway:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hms_db
      DB_USERNAME: hms
      DB_PASSWORD: root
      GATEWAY_SERVICE_URL: http://gateway-ms:9000
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    ports:
      - "8080:8080"
    healthcheck:
      test: "curl --fail --silent http://user-ms:8080/actuator/health/readiness || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - hms-network

  profile-ms:
    build:
      context: ./profileMS
    image: "gourav60/profile-ms:v1"
    container_name: profile-ms
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
      gateway:
        condition: service_healthy
      user-ms:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hms_db
      DB_USERNAME: hms
      DB_PASSWORD: root
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    ports:
      - "8081:8081"
    healthcheck:
      test: "curl --fail --silent http://profile-ms:8081/actuator/health/readiness || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - hms-network

  appointment-ms:
    build:
      context: ./appointment
    image: "gourav60/appointment-ms:v1"
    container_name: appointment-ms
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
      eureka:
        condition: service_healthy
      gateway:
        condition: service_healthy
      profile-ms:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/hms_db
      DB_USERNAME: hms
      DB_PASSWORD: root
      GATEWAY_SERVICE_URL: http://gateway-ms:9000
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka:8761/eureka/
    ports:
      - "8082:8082"
    healthcheck:
      test: "curl --fail --silent http://appointment-ms:8082/actuator/health/readiness || exit 1"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - hms-network

volumes:
  mysql_data:

networks:
  hms-network:
    driver: "bridge"