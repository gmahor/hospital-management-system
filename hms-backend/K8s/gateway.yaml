apiVersion: apps/v1
kind: Deployment

metadata:
  name: gateway-deployment

spec:
  replicas: 1

  selector:
    matchLabels:
      app: gateway

  template:
    metadata:
      labels:
        app: gateway

    spec:

      initContainers:
        - name: wait-for-eureka
          image: busybox
          command:
            [
              "sh",
              "-c",
              "until nc -z eureka-service 8761; do echo waiting for eureka; sleep 5; done;"
            ]

      containers:
        - name: gateway

          image: gourav60/gateway:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 9000

          env:

            - name: USER_SERVICE_URL
              value: http://user-ms-service:8080

            - name: PROFILE_SERVICE_URL
              value: http://profile-ms-service:8081

            - name: APPOINTMENT_SERVICE_URL
              value: http://appointment-ms-service:8082

            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://eureka-service:8761/eureka/

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 40
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 20

---

apiVersion: v1
kind: Service
metadata:
  name: gateway-service

spec:
  selector:
    app: gateway

  ports:
    - port: 9000
      targetPort: 9000

  type: NodePort