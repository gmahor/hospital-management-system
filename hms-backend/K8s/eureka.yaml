apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-deployment
spec:
  replicas: 1

  selector:
    matchLabels:
      app: eureka

  template:
    metadata:
      labels:
        app: eureka

    spec:
      containers:
        - name: eureka

          image: gourav60/eureka:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 8761

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 20

---

apiVersion: v1
kind: Service
metadata:
  name: eureka-service

spec:
  selector:
    app: eureka

  ports:
    - port: 8761
      targetPort: 8761

  type: LoadBalancer